# /etc/sysctl.d/99-swap-tune.conf
# Profile: 2G VPS with a 2G swap file on disk. Not a zram profile.
# Does not create the swap file. See APPLY.md.
# Later files in sysctl.d win. The 99- prefix sorts after most vendor files.

vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.overcommit_memory = 0
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500
